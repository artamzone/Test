<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Мои задачи</h1>
        
        <div class="flex mb-4">
            <input type="text" id="todoInput" placeholder="Что нужно сделать?" 
                   class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="addButton" 
                    class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 transition-colors">
                Добавить
            </button>
        </div>

        <ul id="todoList" class="space-y-2">
            <!-- Задачи будут появляться здесь -->
        </ul>
    </div>

    <script>
        const input = document.getElementById('todoInput');
        const addButton = document.getElementById('addButton');
        const todoList = document.getElementById('todoList');

        function addTask() {
            const text = input.value.trim();
            if (text === '') return;

            const li = document.createElement('li');
            li.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 group transition-all hover:bg-gray-100';
            li.innerHTML = `
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                    <span class="text-gray-700">${text}</span>
                </div>
                <button class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            `;

            // Логика зачеркивания
            const checkbox = li.querySelector('input');
            const span = li.querySelector('span');
            checkbox.addEventListener('change', () => {
                span.classList.toggle('line-through', checkbox.checked);
                span.classList.toggle('text-gray-400', checkbox.checked);
            });

            // Логика удаления
            li.querySelector('button').addEventListener('click', () => {
                li.remove();
            });

            todoList.appendChild(li);
            input.value = '';
        }

        addButton.addEventListener('click', addTask);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
